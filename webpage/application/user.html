<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MAG Control</title>
  <link rel="stylesheet" href="/assets/user.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">MAG Control</div>
      <div id="crumb" class="crumb">Loading…</div>
    </div>

    <div class="actions">
      <button id="btn-back" class="btn btn-ghost" disabled>Back</button>
      <button id="btn-logout" class="btn">Logout</button>
    </div>
  </header>

  <main id="main" class="main" role="main">
    <div id="grid" class="grid" aria-live="polite"></div>

    <div id="empty" class="empty" hidden>
      <div class="empty-title" id="empty-title">No access</div>
      <div class="empty-sub" id="empty-sub">No zones assigned to your user. Please contact the system admin.</div>
    </div>
  </main>

  <!-- Keypad drawer (hidden until device selected) -->
  <section id="drawer" class="drawer" aria-label="Keypad" data-open="false">
    <div class="drawer-head">
      <button class="key key-power" data-cmd="POWER" title="Power" aria-label="Power">
        <span class="icon-power">⏻</span>
      </button>
      <div class="drawer-meta">
        <div id="drawer-title" class="drawer-title">No device selected</div>
        <div id="drawer-sub" class="drawer-sub"></div>
      </div>
      <button id="btn-drawer-close" class="btn btn-ghost">Hide</button>
    </div>

    <div id="keypad" class="keypad">
      <div class="remote" aria-label="Remote keypad">
        <!-- Numbers (1-9) -->
        <div class="remote-numgrid" aria-label="Numbers">
          <button class="key rbtn rbtn-num" data-cmd="1">1</button>
          <button class="key rbtn rbtn-num" data-cmd="2">2</button>
          <button class="key rbtn rbtn-num" data-cmd="3">3</button>

          <button class="key rbtn rbtn-num" data-cmd="4">4</button>
          <button class="key rbtn rbtn-num" data-cmd="5">5</button>
          <button class="key rbtn rbtn-num" data-cmd="6">6</button>

          <button class="key rbtn rbtn-num" data-cmd="7">7</button>
          <button class="key rbtn rbtn-num" data-cmd="8">8</button>
          <button class="key rbtn rbtn-num" data-cmd="9">9</button>
        </div>

        <!-- Row for 0 (like MagicRemote layout). ABC/transport are ignored. -->
        <div class="remote-row remote-row-0" aria-label="Zero row">
          <div class="remote-spacer" aria-hidden="true"></div>
          <button class="key rbtn rbtn-num" data-cmd="0">0</button>
          <div class="remote-spacer" aria-hidden="true"></div>
        </div>

        <!-- Mid section: VOL | D-PAD | CH -->
        <div class="remote-mid">
          <div class="remote-pill" aria-label="Volume">
            <button class="key rbtn rbtn-pill" data-cmd="VOL_PLUS" aria-label="Volume up">+</button>
            <div class="pill-label">VOL</div>
            <button class="key rbtn rbtn-pill" data-cmd="VOL_MINUS" aria-label="Volume down">−</button>
          </div>

          <div class="dpad" aria-label="Navigation">
            <button class="key rbtn rbtn-dir up" data-cmd="UP" aria-label="Up">▲</button>
            <button class="key rbtn rbtn-dir left" data-cmd="LEFT" aria-label="Left">◀</button>
            <button class="key rbtn rbtn-ok" data-cmd="OK" aria-label="OK">OK</button>
            <button class="key rbtn rbtn-dir right" data-cmd="RIGHT" aria-label="Right">▶</button>
            <button class="key rbtn rbtn-dir down" data-cmd="DOWN" aria-label="Down">▼</button>
          </div>

          <div class="remote-pill" aria-label="Channel">
            <button class="key rbtn rbtn-pill" data-cmd="CH_PLUS" aria-label="Channel up">▲</button>
            <div class="pill-label">CH</div>
            <button class="key rbtn rbtn-pill" data-cmd="CH_MINUS" aria-label="Channel down">▼</button>
          </div>
        </div>

        <!-- Bottom system keys (like MagicRemote) -->
        <div class="remote-row remote-row-sys" aria-label="System keys">
          <button class="key rbtn rbtn-sys" data-cmd="MUTE" aria-label="Mute">🔇</button>
          <button class="key rbtn rbtn-sys" data-cmd="BACK" aria-label="Back">↩</button>
          <button class="key rbtn rbtn-sys" data-cmd="HOME" aria-label="Home">⌂</button>
          <button class="key rbtn rbtn-sys" data-cmd="INFO" aria-label="Info">i</button>
          <button class="key rbtn rbtn-sys" data-cmd="MENU" aria-label="Menu">≡</button>
        </div>

        <!-- Colors instead of transport buttons -->
        <div class="remote-row remote-row-colors" aria-label="Color keys">
          <button class="key rbtn rbtn-color red" data-cmd="RED" aria-label="Red"></button>
          <button class="key rbtn rbtn-color green" data-cmd="GREEN" aria-label="Green"></button>
          <button class="key rbtn rbtn-color yellow" data-cmd="YELLOW" aria-label="Yellow"></button>
          <button class="key rbtn rbtn-color blue" data-cmd="BLUE" aria-label="Blue"></button>
        </div>

        <div class="statusbar">
          <div id="status" class="status">Ready.</div>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/user.js"></script>
</body>
</html>
