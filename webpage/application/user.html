<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MAG Control</title>
  <link rel="stylesheet" href="/assets/user.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">MAG Control</div>
      <div id="crumb" class="crumb">Loading…</div>
    </div>

    <div class="actions">
      <button id="btn-back" class="btn btn-ghost" disabled>Back</button>
      <button id="btn-logout" class="btn">Logout</button>
    </div>
  </header>

  <main id="main" class="main" role="main">
    <div id="grid" class="grid" aria-live="polite"></div>

    <div id="empty" class="empty" hidden>
      <div class="empty-title" id="empty-title">No access</div>
      <div class="empty-sub" id="empty-sub">No zones assigned to your user. Please contact the system admin.</div>
    </div>
  </main>

  <!-- Keypad drawer (hidden until device selected) -->
  <section id="drawer" class="drawer" aria-label="Keypad" data-open="false">
    <div class="drawer-head">
      <button class="key key-power" data-cmd="POWER" title="Power" aria-label="Power">POWER</button>
      <div class="drawer-meta">
        <div id="drawer-title" class="drawer-title">No device selected</div>
        <div id="drawer-sub" class="drawer-sub"></div>
      </div>
      <button id="btn-drawer-close" class="btn btn-ghost">Hide</button>
    </div>

    <div id="keypad" class="keypad">
      <div class="kp" aria-label="Remote keypad">

        <div class="kp-section" aria-label="Numbers">
          <div class="kp-grid kp-grid-3">
            <button class="key kp-btn" data-cmd="1">1</button>
            <button class="key kp-btn" data-cmd="2">2</button>
            <button class="key kp-btn" data-cmd="3">3</button>
            <button class="key kp-btn" data-cmd="4">4</button>
            <button class="key kp-btn" data-cmd="5">5</button>
            <button class="key kp-btn" data-cmd="6">6</button>
            <button class="key kp-btn" data-cmd="7">7</button>
            <button class="key kp-btn" data-cmd="8">8</button>
            <button class="key kp-btn" data-cmd="9">9</button>
            <div></div>
            <button class="key kp-btn" data-cmd="0">0</button>
            <div></div>
          </div>
        </div>

        <div class="kp-section" aria-label="Navigation">
          <div class="kp-nav">
            <div class="kp-col">
              <button class="key kp-btn" data-cmd="VOL_PLUS">VOL+</button>
              <button class="key kp-btn" data-cmd="VOL_MINUS">VOL-</button>
            </div>

            <div class="kp-dpad">
              <button class="key kp-btn kp-big" data-cmd="UP">UP</button>
              <div class="kp-dpad-row">
                <button class="key kp-btn kp-big" data-cmd="LEFT">LEFT</button>
                <button class="key kp-btn kp-big" data-cmd="OK">OK</button>
                <button class="key kp-btn kp-big" data-cmd="RIGHT">RIGHT</button>
              </div>
              <button class="key kp-btn kp-big" data-cmd="DOWN">DOWN</button>
            </div>

            <div class="kp-col">
              <button class="key kp-btn" data-cmd="CH_PLUS">CH+</button>
              <button class="key kp-btn" data-cmd="CH_MINUS">CH-</button>
            </div>
          </div>
        </div>

        <div class="kp-section" aria-label="System keys">
          <div class="kp-grid kp-grid-5">
            <button class="key kp-btn" data-cmd="MUTE">MUTE</button>
            <button class="key kp-btn" data-cmd="BACK">BACK</button>
            <button class="key kp-btn" data-cmd="HOME">HOME</button>
            <button class="key kp-btn" data-cmd="INFO">INFO</button>
            <button class="key kp-btn" data-cmd="MENU">MENU</button>
          </div>
        </div>

        <div class="kp-section" aria-label="Color keys">
          <div class="kp-grid kp-grid-4">
            <button class="key kp-btn kp-color red" data-cmd="RED">RED</button>
            <button class="key kp-btn kp-color green" data-cmd="GREEN">GREEN</button>
            <button class="key kp-btn kp-color yellow" data-cmd="YELLOW">YELLOW</button>
            <button class="key kp-btn kp-color blue" data-cmd="BLUE">BLUE</button>
          </div>
        </div>

        <div class="statusbar">
          <div id="status" class="status">Ready.</div>
        </div>

      </div>
    </div>
  </section>

  <script src="/assets/user.js"></script>
</body>
</html>
