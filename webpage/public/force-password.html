<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAG Control — Change Admin Password</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <style>
    .pw-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .pw-card{width:100%;max-width:520px;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px 20px;background:rgba(0,0,0,.25)}
    .pw-title{font-size:20px;font-weight:700;margin:0 0 6px}
    .pw-sub{margin:0 0 16px;opacity:.85}
    .pw-rules{margin:10px 0 14px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
    .pw-rules .bad{color:#ff8a8a;font-weight:600}
    .pw-rules ul{margin:8px 0 0 18px;opacity:.9}
    .row{margin:12px 0}
    .actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:16px}
    .status{margin-top:12px;min-height:20px;opacity:.9}
  </style>
</head>
<body>

  <div class="pw-shell">
    <div class="pw-card">
      <h1 class="pw-title">Change admin password</h1>
      <p class="pw-sub">The app is currently using the default admin password. Please set a new password to continue.</p>

      <div class="pw-rules">
        <div class="bad">Set new password</div>
        <ul>
          <li>Password cannot be <b>admin</b></li>
          <li>Password cannot contain <b>\</b></li>
        </ul>
      </div>

      <form id="pw-form">
        <div class="row">
          <label class="label" for="pw-new">New password (min 8 chars)</label>
          <input id="pw-new" class="input" type="password" autocomplete="new-password" />
        </div>
        <div class="row">
          <label class="label" for="pw-confirm">Confirm password</label>
          <input id="pw-confirm" class="input" type="password" autocomplete="new-password" />
        </div>

        <div class="actions">
          <button id="pw-submit" class="btn" type="submit">Update password</button>
        </div>

        <div id="pw-status" class="status"></div>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/force-password.js"></script>
</body>
</html>
